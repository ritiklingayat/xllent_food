spring.application.name=xllent_e-commerce


# ===============================
# Server
# ===============================
server.port=8082

# ===============================
# PostgreSQL Database
# ===============================
spring.datasource.url=jdbc:postgresql://ep-morning-bonus-at7mgq3r-pooler.c-9.us-east-1.aws.neon.tech/neondb?sslmode=require
spring.datasource.username=neondb_owner
spring.datasource.password=npg_wb3zcjrM0euH

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Explicitly tell Hibernate to speak Postgres
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# Multipart File Upload
# ===============================
# Multipart File Upload configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# CORRECTED: This limits the number of files/parts allowed in a single request
server.tomcat.max-part-count=50

# ===============================
# Static Resource (if storing images locally)
# ===============================
spring.web.resources.static-locations=file:uploads/

# ===============================
# Logging
# ===============================
logging.level.org.springframework.security=DEBUG

# ===============================
# JWT Configuration
# ===============================
jwt.secret=MyVerySecretKeyForJWTAuthentication123456789MyVerySecretKey
jwt.expiration=86400000

# ===============================
# Cloudinary
# ===============================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

frontend.url=${FRONTEND_URL:http://localhost:5173}
