spring.application.name=xllent_e-commerce


# ===============================
# Server
# ===============================
server.port=8082

# ===============================
# PostgreSQL Database
# ===============================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/xllent_food}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Explicitly tell Hibernate to speak Postgres
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===============================
# Multipart File Upload
# ===============================
# Multipart File Upload configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# CORRECTED: This limits the number of files/parts allowed in a single request
server.tomcat.max-part-count=50

# ===============================
# Static Resource (if storing images locally)
# ===============================
spring.web.resources.static-locations=file:uploads/

# ===============================
# Logging
# ===============================
logging.level.org.springframework.security=DEBUG

# ===============================
# JWT Configuration
# ===============================
jwt.secret=${JWT_SECRET:change-this-local-development-secret-to-a-secure-value}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ===============================
# Cloudinary
# ===============================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

frontend.url=${FRONTEND_URL:http://localhost:5173}

# Creates the initial administrator only when explicitly enabled.
app.bootstrap.super-admin.enabled=${BOOTSTRAP_SUPER_ADMIN_ENABLED:false}
app.bootstrap.super-admin.email=${SUPER_ADMIN_EMAIL:superadmin@xllentretailers.com}
app.bootstrap.super-admin.password=${SUPER_ADMIN_PASSWORD:SuperAdmin@123}
